name: persistence_app
description: "Minha Coleção de Jogos (Offline) — demonstração de persistência local com SQLite + SharedPreferences."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Banco de dados relacional embarcado (SQLite)
  sqflite: ^2.3.3+1
  # Gerenciamento de caminhos de arquivos locais (join de paths do SO)
  path: ^1.9.0
  # Armazenamento simples chave-valor (preferências do usuário)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
